<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />


    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />


    <title>Your Name - Your Title</title>
    <meta name="description" content="PLACEHOLDER - one sentence on what you do and who you do it for." />
    <meta name="author" content="Your Name" />
    <meta name="robots" content="index, follow, max-image-preview:large" />



    <meta name="theme-color" content="#F4F4ED" />


    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />



    <link rel="preload" as="image" href="/avatar.svg" fetchpriority="high" media="(min-width: 1100px)" />


    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Name" />
    <meta property="og:title" content="Your Name - Your Title" />
    <meta property="og:description" content="PLACEHOLDER - one sentence on what you do and who you do it for." />


    <meta name="twitter:card" content="summary_large_image" />



    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
